name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Placeholders so `next build` can validate env shape; no real secrets in CI.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Applies every migration to a fresh local stack.
      - run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Export local Supabase credentials
        run: |
          npx supabase status -o json > "$RUNNER_TEMP/supabase.json"
          node -e '
            const s = require(process.argv[1]);
            const pick = (...keys) => keys.map((k) => s[k]).find(Boolean);
            const lines = [
              `TEST_SUPABASE_URL=${pick("API_URL")}`,
              `TEST_SUPABASE_PUBLISHABLE_KEY=${pick("PUBLISHABLE_KEY", "ANON_KEY")}`,
              `TEST_SUPABASE_SECRET_KEY=${pick("SECRET_KEY", "SERVICE_ROLE_KEY")}`,
            ];
            require("node:fs").appendFileSync(process.env.GITHUB_ENV, lines.join("\n") + "\n");
          ' "$RUNNER_TEMP/supabase.json"
      - run: npm run test:db
